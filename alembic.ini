[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Deliberately empty. env.py overrides this with the application's own
# Settings.sentinel_db_path (env var, else .env, else the default), so that
# migrations and the app can never target different files. A URL here would
# be dead config that reads as authoritative — which is exactly how this
# drifted before: the ini said .sentinel.db, .env said data/sentinel.db, and
# migrations quietly went to the wrong one. Set SENTINEL_DB_PATH to change it.
sqlalchemy.url =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
