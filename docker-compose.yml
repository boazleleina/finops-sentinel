
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,cloudwatch,sts
      - DEBUG=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    profiles:
      - dev
      - full

  app:
    build: .
    depends_on:
      - localstack
    ports:
      - "8000:8000"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SENTINEL_DB_PATH=/app/data/sentinel.db
    env_file:
      - .env
    volumes:
      # Mount a directory, not the db file itself: if the file doesn't exist
      # yet, Docker would create a directory in its place and sqlite would fail.
      - ./data:/app/data
    profiles:
      - dev
      - full
