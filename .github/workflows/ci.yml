name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,cloudwatch,sts
          DEBUG: 1

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check src tests
      
    - name: Type check with Mypy
      run: mypy src
      
    - name: Check architecture with import-linter
      run: lint-imports
      
    # No AWS_ENDPOINT_URL here: boto3 honors that env var natively, which would
    # route moto-based unit tests at the LocalStack service container. The
    # integration suite hardcodes localhost:4566 itself.
    - name: Run tests with pytest
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
      run: |
        pytest tests/ -v --cov=src/finops_sentinel --cov-report=term-missing --cov-fail-under=90

    # The domain is the layer the whole architecture rests on: guardrails, the
    # state machine, and the approval logic all live there, and all of it is
    # testable with in-memory fakes. It is held to a higher bar than the
    # adapters, which spend their statements on boto3 and HTTP calls that are
    # only coverable by mocking the client back at itself.
    #
    # ports/ is deliberately NOT included. Its abstract bodies are `...` under
    # `# pragma: no cover`, so the only statements left are imports and `def`
    # lines, which execute on import — it reports 100% without a single test
    # and would just pad the denominator.
    - name: Coverage gate on the domain layer
      run: coverage report --include='*/domain/*' --fail-under=95
